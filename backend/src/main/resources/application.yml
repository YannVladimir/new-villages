spring:
  application:
    name: onevillage-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:new-villages}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:mail.carmani-business.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:test@carmani-business.com}
    password: ${MAIL_PASSWORD:Testpassword2026}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}
            trust: ${MAIL_HOST:mail.carmani-business.com}
            checkserveridentity: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-change-me-32bytes}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  mail:
    from: ${MAIL_FROM:test@carmani-business.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: ${UPLOADS_BASE_URL:http://localhost:8080/uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-leader: ${STRIPE_PRICE_LEADER:}
    price-organization: ${STRIPE_PRICE_ORGANIZATION:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/pricing?checkout=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/pricing?checkout=cancelled}
  terms:
    seed-version: 1.0.0
  seed:
    admin-email: ${ADMIN_SEED_EMAIL:admin@onevillage.ca}
    admin-password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.onevillage.backend: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
